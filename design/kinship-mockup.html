<!DOCTYPE html>
<!--
KNOWN DIFFERENCES FROM THE BUILT APP (as of 0.3.0 step 35, Nov 21 2026)
This file is the approved specification, but the built app has moved on. Where they differ, the built behaviour below wins; ask JC if unsure. A full catch-up pass is planned after step 37, before 0.3.0-rc.1. Older differences are listed in kinship-build-status-and-handoff.md, section "Corrections to older docs".
1. Chart: this mockup has no gear panel (Cards, Names, Relatives, Navigation), no scroll mode for the mouse wheel and no hidden-relatives legend row. In the app, aunts, uncles and cousins are hidden by default and shown from the gear.
2. Relationship finder: the app gives in-law and step names only for Married and Widowed partners (here Separated counts too). Divorced, Annulment and Separated partners of a blood relative read "ex-" (here any status counts as a former partner). A spouse's grandchild reads "Step-grandson" (here "Wife's grandson"). A single shared ancestor is "half" only when a side has a second, different known parent (here always half). The app has no "With birth places" switch and no Print or PDF in 0.3.0 (they come in 0.5 and 0.7).
3. Admin, Users: the app has a row actions menu with Change role, Disable or Enable, and Delete. A disabled account is signed out and cannot sign in; Delete needs the account disabled first and a typed email. Nobody acts on their own account, and the last SuperAdmin can never be demoted, disabled or deleted. This mockup shows none of it.
4. My settings: the line saying the chart's gear panel shows the same settings is true for Names only.
-->

.brn{--lf:#4F8A4B;--lfh:#5fa05a;cursor:pointer;outline:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brn{--lf:#8CC488;--lfh:#a3d4a0}}:root[data-theme="dark"] .brn{--lf:#8CC488;--lfh:#a3d4a0}.brn .hit{fill:transparent}.brn .stem{stroke:var(--lf);stroke-width:3.5;stroke-linecap:round;fill:none}.brn .leaf{fill:var(--lf);stroke:#fff;stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}.brn .vein{stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;pointer-events:none}.brn:hover .leaf,.brn:focus .leaf{fill:var(--lfh)}.brn:hover .stem,.brn:focus .stem{stroke:#46b85d}
@keyframes flipin{from{transform:perspective(1100px) rotateY(-100deg);opacity:0}60%{opacity:1}to{transform:perspective(1100px) rotateY(0);opacity:1}}.flipin{animation:flipin .55s cubic-bezier(.2,.7,.2,1);transform-origin:50% 50%}@media (prefers-reduced-motion:reduce){.flipin{animation:none}}
.sidebanner{position:absolute;left:12px;top:12px;z-index:3;display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:var(--shadow)}
.pnode rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.pnode.dec rect{fill:var(--bg)}
.pnode.sel rect{stroke:var(--accent);stroke-width:2.5}
.pnode text{fill:var(--ink);font:500 13px var(--body);pointer-events:none}
.pnode text.s{fill:var(--muted);font-size:11px}
.pnode circle{fill:var(--accent-soft)}
.pnode text.ini{fill:var(--accent);font:600 12px var(--display)}
.pnode{cursor:pointer}
.vmenu{position:absolute;top:10px;right:10px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.vmenu .tgl{width:36px;height:36px;padding:0;display:grid;place-items:center;background:var(--panel)}
.vmenu .tgl[aria-expanded=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vpanel{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:var(--shadow)}
.vpanel .tvseg .btn{width:34px;height:32px;padding:0;display:grid;place-items:center}
.vpanel .tvseg .btn.num{font-weight:600;font-size:13px}
.vgl{color:var(--muted);display:grid;place-items:center;padding:0 2px}
.tvseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.tvseg .btn{border:0;border-radius:0;border-right:1px solid var(--line)}.tvseg .btn:last-child{border-right:0}
.tvseg .btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.vinfo{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.ptitle{fill:var(--muted);font:600 11px var(--body);text-transform:uppercase;letter-spacing:.05em}
.pempty rect{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}.pempty text{fill:var(--muted);font:400 12px var(--body)}
.fanw path{fill:var(--accent-soft);stroke:var(--panel);stroke-width:2}.fanw.mat path{fill:var(--warn-soft)}.fanw.dec path{opacity:.78}.fanw.sel path{stroke:var(--accent);stroke-width:3}.fanw:hover path{filter:brightness(.96)}
.fanw text{fill:var(--ink);font:500 11.5px var(--body)}.fanw text.s{fill:var(--muted);font-size:10px}
.fanE{fill:none;stroke:var(--line);stroke-dasharray:4 4;stroke-width:1.2}
.fanc circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
.fanc text{fill:var(--ink);font:600 13px var(--display);text-anchor:middle}.fanc text.s{font:400 10.5px var(--body);fill:var(--muted)}
.ebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.ebar i{display:block;height:100%;background:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.stat b{display:block;font:600 24px var(--display);color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .pill{font-weight:500}.chips .pill.hit{background:var(--accent);color:var(--accent-ink);font-weight:600}
.modal label.inl{display:flex;flex-direction:row;gap:8px;align-items:flex-start;color:var(--ink);font-weight:400}.modal .seg label.opt{display:flex;flex-direction:row;gap:10px;align-items:flex-start}.modal label.inl input,.modal .seg label.opt input{width:auto;flex:none;margin:3px 0 0}.modal label.inl{flex-wrap:wrap}
.pnode .dnab circle,.dnab circle{fill:#e8892b;stroke:var(--panel);stroke-width:1.5}.pnode .dnab path{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round}
.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.lrow:last-child{border-bottom:0}
.edge{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.7}
.edge.couple{stroke-dasharray:none;stroke-width:2.2}

/* Map */
.map{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:8px;aspect-ratio:16/10;overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:6px 0 10px}
.tl .ev:before{content:"";position:absolute;left:-19px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl .yr{font:600 12px var(--mono);color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.tile .ph{aspect-ratio:4/3;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ph svg{width:34px;height:34px}
.tile div.c{padding:6px 8px;font-size:12px}
.switch{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.switch button{border:0;background:var(--panel);padding:4px 10px}
.switch button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

.pop{position:absolute;right:0;top:38px;width:300px;z-index:10;padding:8px}
.pop .it{padding:8px;border-bottom:1px solid var(--line)} .pop .it:last-child{border:0}
.row-act{display:flex;gap:4px;justify-content:flex-end}
.seg{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mail{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px}
.list{position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:210px;overflow:auto;z-index:25;padding:4px}
.list .hd{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px 2px}
.copt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer}
.copt[aria-selected=true],.copt:hover{background:var(--accent-soft)}
.copt[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.copt .k{font-size:11px;color:var(--muted);white-space:nowrap}
.copt.new{color:var(--accent);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 6px 6px}
/* Entry screens */
.center{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--bg)}
.entry{width:100%;max-width:400px;padding:26px}
.entry label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.entry input{width:100%}
.entry .btn{width:100%;margin-top:12px;padding:9px}
.entry select{width:100%}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.rgrid .rexpl{position:sticky;top:12px}
@media (max-width:1100px){.rgrid{grid-template-columns:minmax(0,1fr)}.rgrid .rexpl{position:static}}
.dpv{font-size:11px;min-height:15px;margin-top:3px}
.entry .sunav .btn{width:auto;margin-top:0;padding:8px 16px}
.entry .btn.sm.inl{width:auto;padding:6px 10px}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0 2px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.5);display:grid;place-items:center;padding:16px;z-index:20}
.arscrim{background:rgba(18,18,18,.78);overflow:auto}
.arclose{position:fixed;top:14px;right:20px;background:none;border:0;color:#fff;font:inherit;font-size:15px;cursor:pointer;padding:6px 8px}
.arstage{position:relative;width:860px;flex:none;margin:auto}
.arstage svg.arl{position:absolute;inset:0;pointer-events:none}
.arc{position:absolute;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);color:var(--ink);border:2px solid var(--arc,#2aa6c9);border-radius:6px;font:inherit;text-align:left;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.arc:hover:not(:disabled){box-shadow:0 0 0 3px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.25)}
.arc:disabled{opacity:.45;cursor:not-allowed}
.arc.m{--arc:#2aa6c9}.arc.f{--arc:#ec6d6a}.arc.n{--arc:#8a8f98}
.arc b{display:block;white-space:nowrap;font-size:15px;font-weight:600}.arc small{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px}
.arc .sil{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid #cfd3d7;overflow:hidden}
.arc.ctr{cursor:default;border-color:var(--arc);padding:0 16px}
.arc.ctr .avatar{flex:none;width:52px;height:52px}
@media (max-width:860px){.arstage{zoom:.7}}
.modal{width:100%;max-width:460px;max-height:92%;overflow:auto;padding:18px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal select{width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-size:13px;max-width:90%}
.hidden{display:none!important}
.lock{display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}

@media (max-width:860px){
  .top{flex-wrap:wrap;padding:6px 12px;gap:8px}
  .tabsnav{order:5;width:100%;margin:0;overflow-x:auto;min-height:44px}
  .tabsnav button{padding:0 12px;white-space:nowrap}
  .acct .who{display:none}
  .menu{position:fixed;left:12px;right:12px;top:auto;width:auto}
  .treewrap,.treewrap.collapsed{grid-template-columns:minmax(0,1fr);grid-template-rows:55vh auto;height:auto}
  .treewrap .canvas{order:-1}
  .collapsed .side{flex-direction:row;padding:8px 12px;justify-content:flex-start}
  .railname{writing-mode:horizontal-tb}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:110px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.btn,.tabsnav button,.menu .mi{transition:background .12s,border-color .12s}}
.fsp{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.fsp>summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;list-style:none}
.fsp>summary::-webkit-details-marker{display:none}
.fsp>summary::before{content:'+';color:var(--accent);font-weight:700;width:12px}
.fsp[open]>summary::before{content:'\2212'}
.fsb{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;margin-left:5px;vertical-align:middle}
.fchip svg{width:11px;height:11px}
.fadd{margin-left:6px;font-size:11px;padding:1px 8px}
tr.selrow td{background:var(--accent-soft)}
.rec{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px}
.cmp td,.cmp th{vertical-align:top}
</style>

function pedSvg(){

/* ---------- Relationship engine (no AI: pure graph walk) ---------- */
const WORD=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const ORD=['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth'];
const GP=n=>n<=0?'':n===1?'Great-':n===2?'Great-great-':n+'x great-';
const gnd=(g,m,f,n)=>g==='Male'?m:g==='Female'?f:n;
function ancMap(id){

}
function bloodName(dA,dB,half,g){

  if(dA===0){const n=dB-1;w=n===0?gnd(g,'son','daughter','child'):GP(n-1).toLowerCase()+'grand'+gnd(g,'son','daughter','child');if(n>0&&n-1>=0)w=(n===1?'':GP(n-1).toLowerCase())+'grand'+gnd(g,'son','daughter','child')}
  else if(dB===0){const n=dA-1;w=n===0?gnd(g,'father','mother','parent'):(n===1?'':GP(n-1).toLowerCase())+'grand'+gnd(g,'father','mother','parent')}
  else if(dA===1&&dB===1)w=gnd(g,'brother','sister','sibling');
  else if(dA===1){const n=dB-2;w=(n===0?'':n===1?'grand':GP(n-1).toLowerCase()+'grand')+gnd(g,'nephew','niece','nibling');if(n>=1)w=(n===1?'grand':GP(n-1).toLowerCase()+'grand')+gnd(g,'nephew','niece','nibling')}
  else if(dB===1){const n=dA-2;w=(n===0?'':n===1?'great-':GP(n).toLowerCase())+gnd(g,'uncle','aunt','parent’s sibling')}
  else{const deg=Math.min(dA,dB)-1,rm=Math.abs(dA-dB);return (half?'Half ':'')+(ORD[deg]||deg+'th')+' cousin'+(rm?' '+(rm===1?'once':rm===2?'twice':WORD[rm]+' times')+' removed':'')}
  return cap(H+w);
}
function blood(a,b){

  if(cousin&&rm)note=`${P[b].given} is ${rm===1?'one generation':WORD[rm]+' generations'} ${dB>dA?'younger':'older'} than ${P[a].given}.`;
  return {label,kind:'blood',lca,x0,left:A[x0].path.slice(0,-1).reverse(),right:B[x0].path.slice(0,-1).reverse(),dA,dB,half,note};
}
const parentWord=g=>gnd(g,'Father','Mother','Parent');
function stepSib(a,b){
  const spouses=id=>unionsOf(id).filter(u=>isM(u.st)||u.st==='Separated').map(u=>otherOf(u,id));
  for(const par of P[a].par)for(const sp of spouses(par)){if(P[a].par.includes(sp))continue;
    if(P[b].par.includes(sp)&&!blood(a,b))return {label:gnd(P[b].g,'Stepbrother','Stepsister','Stepsibling'),kind:'chain',chain:[a,par,sp,b],labels:[parentWord(P[par].g),partnerLabel('Married',P[sp].g,!!P[sp].d),gnd(P[b].g,'Son','Daughter','Child')]};}
  return null;
}
function relate(a,b){
  if(a===b)return {label:'Same person',kind:'none'};
  const r=blood(a,b);if(r)return r;
  const spouses=id=>unionsOf(id).filter(u=>isM(u.st)||u.st==='Separated').map(u=>otherOf(u,id));
  const u0=unionsOf(a).find(u=>otherOf(u,a)===b);
  if(u0)return {label:partnerLabel(u0.st,P[b].g,!!P[b].d),kind:'chain',chain:[a,b],labels:[partnerLabel(u0.st,P[b].g,!!P[b].d)]};
  // B is a blood relative of A's spouse
  for(const sp of spouses(a)){const q=blood(sp,b);if(!q)continue;
    const L=q.label,pl=partnerLabel('Married',P[sp].g,!!P[sp].d);let label;
    if(L==='Brother'||L==='Sister'||L==='Half-brother'||L==='Half-sister')label=gnd(P[b].g,'Brother-in-law','Sister-in-law','Sibling-in-law');
    else if(L==='Father'||L==='Mother')label=gnd(P[b].g,'Father-in-law','Mother-in-law','Parent-in-law');
    else if(L==='Son'||L==='Daughter')label=gnd(P[b].g,'Stepson','Stepdaughter','Stepchild');
    else label=pl+'’s '+L.toLowerCase();

  for(const sp of spouses(b)){const q=blood(a,sp);if(!q)continue;
    const L=q.label,pl=partnerLabel('Married',P[b].g,!!P[b].d);let label;
    if(L==='Brother'||L==='Sister'||L==='Half-brother'||L==='Half-sister')label=gnd(P[b].g,'Brother-in-law','Sister-in-law','Sibling-in-law');
    else if(L==='Son'||L==='Daughter')label=gnd(P[b].g,'Son-in-law','Daughter-in-law','Child-in-law');
    else if(L==='Father'||L==='Mother')label=gnd(P[b].g,'Stepfather','Stepmother','Stepparent');

  // B is a blood relative of A's step-sibling
  {let best=null;for(const x of Object.keys(P)){if(x===a||x===b)continue;const r1=stepSib(a,x);if(!r1)continue;const q=blood(x,b);if(!q)continue;const sc=q.dA+q.dB;if(!best||sc<best.sc)best={sc,v:{label:r1.label+'\u2019s '+q.label.toLowerCase(),kind:'chain',chain:[a,x,b],labels:[r1.label,q.label]}}}if(best)return best.v}
  // B is a former partner of one of A's blood relatives
  for(const u of unionsOf(b)){if(['Friends','Unknown','Other'].includes(u.st))continue;const sp=otherOf(u,b),q=blood(a,sp);if(!q)continue;const pl=partnerLabel(u.st,P[b].g,!!P[b].d);return {label:q.label+'\u2019s '+pl.toLowerCase(),kind:'chain',chain:[a,sp,b],labels:[q.label,pl]};}
  return {label:'No relationship found',kind:'none'};
}
function rcard(id,det,hl){const p=P[id];return `<button class="rcard ${hl?'hl':''}" data-p="${id}" data-go-p="${id}" title="Open ${esc(p.n)}"><span class="av">${ini(id)}</span><b>${esc(p.n)}</b><small>${span(id)}</small>${det==='full'&&p.bp?`<small>${esc(p.bp)}</small>`:''}</button>`}

/* Explainer for "X times removed", shown only when the result is a removed cousin */
function removedExplainer(r,a,b){

    else if(b.k==='btns')L.push(b.a.t+': '+b.a.u,b.b.t+': '+b.b.u,'');

}

const COMPOSE=`# compose.yml (illustrative, final images depend on the stack we pick)
services:
  web:                          # static UI, proxies /api to the api service
    image: kinship-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:8080"             # plain HTTP, your reverse proxy terminates TLS
  api:
    image: kinship-api:latest   # same version tag as web
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env              # or Docker secrets via *_FILE
    environment:
      DATABASE_URL: postgres://kinship_app:\${APP_DB_PASSWORD}@db:5432/kinship
      MIGRATE_DATABASE_URL: postgres://kinship_owner:\${OWNER_DB_PASSWORD}@db:5432/kinship
      PUBLIC_URL: https://tree.example.com
      STORAGE_DRIVER: local          # or s3
      FILE_ENCRYPTION: "on"          # AES-256-GCM before upload (default). Key in .env
      # S3_SSE: AES256              # optional provider-side encryption on top (s3 only)
      MAIL_PROVIDER: resend          # or smtp
      MAIL_FROM: KinShip <tree@example.com>
      MAP_PROVIDER: osm              # default; or maptiler (key in .env)
      BACKUP_ENABLED: "on"           # nightly encrypted backup (passphrase in .env)
      BACKUP_DEST: local             # or s3 (a separate bucket)
      TZ: America/New_York
    volumes:
      - ./data/media:/var/lib/kinship/media
      - ./data/backups:/var/lib/kinship/backups
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinship
      POSTGRES_USER: kinship_owner
      POSTGRES_PASSWORD: \${OWNER_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinship_owner -d kinship"]
      interval: 5s
      retries: 10`;

function upcoming(){
  const today=new Date(2026,10,13);
  return Object.keys(BD).filter(id=>!dead(id)&&!P[id].minor).map(id=>{
    const [mo,d]=BD[id].split('-').map(Number);let nx=new Date(2026,mo-1,d);if(nx<today)nx=new Date(2027,mo-1,d);
    return {id,days:Math.round((nx-today)/864e5),age:nx.getFullYear()-P[id].b,date:nx}}).sort((a,b)=>a.days-b.days);
}

function dnaCheck(tester,m){

  const tip=`Typical for this relationship: ${e.lo.toLocaleString()} to ${e.hi.toLocaleString()} cM`;
  if(m.cm<e.lo)return {k:'warn',t:'Lower than expected',tip};

function addDiagram(){
  const id=S.sel,p=P[id],adm=isAdmin();
  const kinds=p.par.map(x=>P[x].g);
  const needF=!kinds.includes('Male'),needM=!kinds.includes('Female');
  const showPar=p.par.length<2&&(needF||needM);
  const hasPartner=unionsOf(id).length>0;
  const pc=p.g==='Male'?'f':p.g==='Female'?'m':'n';
  const W=860,H=48,cw=220,chh=84;
  const oy=showPar?(H+70):0,cy=oy;
  const card=(k,label,x,y,w,h,cls,sub,ok)=>`<button class="arc ${cls}" data-act="addrel:${k}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px" ${ok?'':'disabled title="Ask an admin to add this relative"'}><span class="sil">${SIL[cls==='f'?'f':'m']}</span><span><b>${label}</b>${sub?`<small>${sub}</small>`:''}</span></button>`;
  let cards='',lines='';
  const L=(d)=>`<path d="${d}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.2"/>`;
  const cx=W/2,cxl=cx-cw/2,cxr=cx+cw/2;
  if(showPar){
    const both=needF&&needM;
    if(both){cards+=card('father','Add father',cx-250,0,210,H,'m','',adm)+card('mother','Add mother',cx+40,0,210,H,'f','',adm);lines+=L(`M${cx-40} ${H/2}H${cx+40}`)+L(`M${cx} ${H/2}V${cy}`)}
    else if(needF){cards+=card('father','Add father',cx-105,0,210,H,'m','',adm);lines+=L(`M${cx} ${H}V${cy}`)}
    else{cards+=card('mother','Add mother',cx-105,0,210,H,'f','',adm);lines+=L(`M${cx} ${H}V${cy}`)}
  }
  const sub=`<div class="arc ctr ${p.g==='Male'?'m':p.g==='Female'?'f':'n'}" style="left:${cxl}px;top:${cy}px;width:${cw}px;height:${chh}px;cursor:default"><div class="avatar">${avIn(id)}</div><div style="min-width:0"><b>${esc(p.n)}</b><small>${p.b||''}${p.d?' – '+p.d:''}</small></div></div>`;
  cards+=sub;
  const ym=cy+chh/2;
  const sb=cy-34,ss=cy+66;
  cards+=card('brother','Add brother',20,sb,210,H,'m','',adm)+card('sister','Add sister',20,ss,210,H,'f','',adm);
  lines+=L(`M230 ${sb+H/2}H262V${ss+H/2}H230`)+L(`M262 ${ym}H${cxl}`);
  cards+=card('partner',hasPartner?'Add another partner':'Add partner',cxr+50,cy+10,250,64,pc,'Husband, ex-husband, partner, …',adm);
  lines+=L(`M${cxr} ${ym}H${cxr+50}`);
  const ky=cy+chh+70;
  cards+=card('son','Add son',cx-230,ky,200,H,'m','',true)+card('daughter','Add daughter',cx+30,ky,200,H,'f','',true);
  lines+=L(`M${cx} ${cy+chh}V${cy+chh+35}`)+L(`M${cx-130} ${ky}V${cy+chh+35}H${cx+130}V${ky}`);
  const sh=ky+H+10;
  return `<div class="scrim arscrim" data-close="1"><button class="arclose" data-close="1" aria-label="Close">Close &#x2715;</button>
   <div><div class="arstage" style="height:${sh}px"><svg class="arl" width="${W}" height="${sh}" viewBox="0 0 ${W} ${sh}">${lines}</svg>${cards}</div>
   <div style="text-align:center;margin-top:6px"><span style="color:#d8d8d8;font-size:13px">${adm?'':'You can add children here. To add anyone else, ask an admin.'}</span>${adm?'<button class="btn sm" data-act="addrel:custom" style="margin-left:8px">Other relationship, like godparent or guardian</button>':''}</div></div></div>`;
}

  if(e.target.id==='dfSel'){S.df=e.target.value;toast('Dates now show as '+DFMT[S.df].replace(' (day first)','')+'.');render(true)}
  if(e.target.id==='pSel'){S.sel=e.target.value;render(true)}
  if(e.target.id==='ra'){S.ra=e.target.value;render(true)}
  if(e.target.id==='rb'){S.rb=e.target.value;render(true)}
  if(e.target.id==='rdet'){S.rdet=e.target.value;render(true)}
  if(e.target.id==='rwho'){S.rep.who=e.target.value;render(true)}
  if(e.target.name==='ropt'){S.rep[e.target.value]=e.target.checked;render(true)}
  if(e.target.name==='emnote'){S.em.note=e.target.checked;render(true)}
  if(e.target.id==='rfu'){S.rep.u=+e.target.value;render(true)}
  if(e.target.name==='bopt'){S.rep.bk[e.target.value]=e.target.checked;render(true)}
  if(e.target.id==='btSel'){const id=S.medP;MED[id].bt=e.target.value;AUD[id].unshift({w:'Nov 13, 2026',b:P[id].self?'You':'Admin ('+ROLES[S.role]+')',t:'Set blood type to '+e.target.value});toast('Blood type saved.');render(true)}
  if(e.target.name==='medsw'){const sw=P.marcus.sw=P.marcus.sw||[],v=e.target.value;if(e.target.checked){if(!sw.includes(v))sw.push(v)}else P.marcus.sw=sw.filter(x=>x!==v);AUD.marcus.unshift({w:'Nov 14, 2026',b:'You',t:(e.target.checked?'Shared record with ':'Stopped sharing record with ')+P[v].n});render(true)}
  if(e.target.name==='sys-storage'){S.sys.storage=e.target.value;render(true)}
  if(e.target.name==='sys-mail'){S.sys.mail=e.target.value;render(true)}
  if(e.target.name==='sys-map'){S.sys.map=e.target.value;render(true)}
  if(e.target.dataset&&e.target.dataset.ns){const k=e.target.dataset.ns;S.ns[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;render(true)}
  if(e.target.id==='pseudo'){S.pseudo=e.target.checked;render(true)}
});
document.addEventListener('input',e=>{if(myInput(e))return;if(e.target.classList&&e.target.classList.contains('dateIn')){const pv=document.getElementById(e.target.id+'-pv'),f=fISO(e.target.value);if(pv)pv.textContent=f===null?'Use YYYY-MM-DD, YYYY-MM or YYYY':f?'Shows as '+f:'';return}
if(e.target.id==='mq'){S.mf.q=e.target.value;$('#mgrid').innerHTML=mediaGrid();return}
 if(e.target.id==='cn'){S.ci=0;paintList();syncType()}
 if(e.target.id==='ct'){S.ti=0;paintType()}});
document.addEventListener('focusin',e=>{if(e.target.id==='cn')paintList();if(e.target.id==='ct')paintType()});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ct'){
    const open=!$('#ctl').classList.contains('hidden');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!open)paintType();else{S.ti=(S.ti+(e.key==='ArrowDown'?1:-1)+TOPTS.length)%Math.max(TOPTS.length,1);paintType()}return}
    if(e.key==='Enter'&&open&&TOPTS.length){e.preventDefault();pickType(S.ti);return}
    if(e.key==='Escape'&&open){e.preventDefault();hideType();return}
  }
  if(e.target.id==='cn'){
    const open=!$('#cl').classList.contains('hidden');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!open)paintList();else{S.ci=(S.ci+(e.key==='ArrowDown'?1:-1)+OPTS.length)%Math.max(OPTS.length,1);paintList()}return}
    if(e.key==='Enter'&&open&&OPTS.length){e.preventDefault();pick(S.ci);return}
    if(e.key==='Escape'&&open){e.preventDefault();hideList();return}
  }
  if(e.key==='Escape'&&!S.modal&&(S.menu||S.bell)){S.menu=false;S.bell=false;render(true)}
  if(e.key==='Escape'&&S.modal){S.modal=null;render(true)}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.pnode')){e.preventDefault();S.sel=e.target.closest('.pnode').dataset.p;render()}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.map [data-place]')){e.preventDefault();S.place=e.target.closest('[data-place]').dataset.place;render(true)}
});

/* Canvas pan and zoom */
function applyT(){const g=$('#g');if(g)g.setAttribute('transform',`translate(${S.x} ${S.y}) scale(${S.k})`)}
function zoom(d){if(d===0){const f=S.fit||[.49,8,115];S.k=f[0];S.x=f[1];S.y=f[2]}else S.k=Math.min(2.2,Math.max(.4,S.k*(d>0?1.2:1/1.2)));applyT()}
function initCanvas(){
  const c=$('#canvas');if(!c)return;applyT();
  let drag=null;
  c.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom')||e.target.closest('.pnode')||e.target.closest('.vmenu')||e.target.closest('.brn')||e.target.closest('.sidebanner'))return;drag={x:e.clientX,y:e.clientY,ox:S.x,oy:S.y};c.setPointerCapture(e.pointerId)});
  c.addEventListener('pointermove',e=>{if(!drag)return;const r=$('#svg').getBoundingClientRect(),sc=900/r.width;S.x=drag.ox+(e.clientX-drag.x)*sc;S.y=drag.oy+(e.clientY-drag.y)*sc;applyT()});
  c.addEventListener('pointerup',()=>drag=null);
  c.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1:-1)},{passive:false});
  c.addEventListener('click',e=>{const ul=e.target.closest('[data-uline]');if(ul&&canEditU(UNIONS[+ul.dataset.uline])){S.uid=+ul.dataset.uline;S.modal='union';render(true);return}const n=e.target.closest('.pnode');if(n){S.sel=n.dataset.p;render()}});
}
function initImport(){
  const d=$('#drop'),f=$('#gedFile');if(!d)return;
  const show=name=>{const r=$('#impResult');r.classList.remove('hidden');r.innerHTML=`<div class="callout"><b>${esc(name)}</b> read. Review before importing.</div>
   <div class="tblwrap"><table><tbody><tr><td>People</td><td class="num">214</td></tr><tr><td>Families</td><td class="num">78</td></tr><tr><td>Sources with URLs</td><td class="num">96</td></tr><tr><td>Media references</td><td class="num">41</td></tr><tr><td>Possible duplicates of existing people</td><td class="num"><span class="pill warn">6</span></td></tr><tr><td>Warnings (unknown tags, partial dates)</td><td class="num"><span class="pill warn">12</span></td></tr></tbody></table></div>
   <div class="row"><button class="btn primary" data-act="mocksave" ${isAdmin()?'':'disabled'}>Import into tree</button><button class="btn">Review duplicates</button></div>`};
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',e=>{const fl=e.dataTransfer.files[0];show(fl?fl.name:'sample.ged')});
  f.addEventListener('change',()=>show(f.files[0]?f.files[0].name:'sample.ged'));
}
</script><script src="patch-tr.js"></script><script>(function init(){const h=location.hash.slice(1);if(VIEWS[h])S.view=h;render()})();
</script>
