# SPDX-License-Identifier: AGPL-3.0-or-later
packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# Dependency install scripts are off unless allowed here on purpose.
# esbuild (used by tsx and vitest) ships its binary as a platform package; its
# install script is only an optional speed-up, so it stays off.
allowBuilds:
  esbuild: false

# minimatch below 11.0.1 has a known vulnerability. Only a development tool
# (typescript-eslint's parser) still asked for 10.x; nothing shipped uses it.
# Remove when typescript-estree allows minimatch 11; drop first if type-aware lint rules misbehave.
overrides:
  'minimatch@<11.0.1': '>=11.0.1'

# Astro (the docs site build) depends on sharp, whose prebuilt libvips binaries are LGPL-3.0-or-later, not on the allow list.
# The docs have no images that need optimizing (astro.config.mjs uses the passthrough image service), so the binaries are
# never installed and nothing LGPL enters the lockfile or the license check.
ignoredOptionalDependencies:
  - '@img/sharp-*'
