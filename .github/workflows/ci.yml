# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the whole of CI again before it builds anything.
  workflow_call:

# A new push to a pull request cancels the older run. Runs on main always finish.
concurrency:
  # The workflow name is part of the group: when the release workflow calls this one, it is the
  # release's name, so the two never share a group (and never cancel or wait for each other).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  check:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Node 26 does not bundle corepack. Same pinned version as the Dockerfile.
      - name: Enable pnpm (pinned in package.json)
        run: npm install --global corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # scripts/build-docs.test.mjs builds the website's Docs pages from INSTALL.md and the other documents, so a broken
      # link in them fails here and not at deploy time. It needs pandoc.
      - name: Install pandoc (for the docs pages test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: pnpm test:scripts
      - run: pnpm build

  test:
    name: Tests (Postgres 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kinship
          POSTGRES_PASSWORD: dev-owner-password
          POSTGRES_DB: kinship
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kinship -d kinship"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5433'
      TEST_DB_USER: kinship
      TEST_DB_PASSWORD: dev-owner-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (pinned in package.json)
        run: npm install --global corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      # The backup tests run pg_dump, pg_restore and psql. They must be version 18 (the server's): the runner's own
      # client is older. PostgreSQL's own apt repository, pinned to the 18 client package.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pnpm test

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (pinned in package.json)
        run: npm install --global corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check licenses against the allow list
        run: pnpm licenses:check
      - name: Save the license report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: reports/
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Build api image (not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: kinship-api:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image does not run as root
        run: test "$(docker run --rm --entrypoint id kinship-api:ci -u)" != "0"

  docker-web:
    name: Build web image (not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: kinship-web:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Image does not run as root
        run: test "$(docker run --rm --entrypoint id kinship-web:ci -u)" != "0"
      - name: Smoke test (serves the UI, answers /healthz, fails fast without an api)
        run: |
          docker run -d --name web -p 8080:8080 kinship-web:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/about | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/version)" = "502"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'

  # Not a required check (yet). A real installation of the previous release is filled with data, upgraded in place to the images
  # built here, and checked (scripts/upgrade-test.sh). Because release.yml runs this whole file, it also gates every tag.
  upgrade:
    name: Upgrade test (previous release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the previous release's images
    env:
      GH_TOKEN: ${{ github.token }}
      # On a tag (the release workflow calls this file) only older releases are candidates; otherwise the newest published one.
      ON_TAG: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (pinned in package.json)
        run: npm install --global corepack@0.34.6 && corepack enable
      # The script reads packages/shared's built code to work out what the What's new popup should say.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kinship/shared build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR (for the previous release's images)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The images of this commit: the same build arguments as the two image jobs, so the layers come from their cache.
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: ghcr.io/officialjcreyes/kinship-api:upgrade
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: ghcr.io/officialjcreyes/kinship-web:upgrade
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
      - name: Upgrade the previous release in place, and restore its safety copy on an empty database
        run: ./scripts/upgrade-test.sh upgrade "${{ github.sha }}"
      # The automatic start above moves forward with every release (0.2.0-rc.1, then rc.2, then rc.3, then 0.2.0, ...), so the upgrade
      # that real installations still make from the first alpha-to-0.2 jump would stop being tested. This step pins it: same
      # job, same images, so it adds no build time and no new check name. It runs even when the step above failed, so one
      # failure never hides the other. A pinned version without scripts/upgrade-test/seed-<version>.sh fails loudly.
      - name: Upgrade 0.1.0-alpha.2 in place (pinned), and restore its safety copy on an empty database
        if: ${{ !cancelled() }}
        env:
          PREVIOUS_TAG: v0.1.0-alpha.2
        run: ./scripts/upgrade-test.sh upgrade "${{ github.sha }}"
      # The release candidates between them: rc.1 is what a few installs still run, and it is neither the newest published release
      # (the first step above) nor the first alpha-to-0.2 jump. Same job and images again, so no new check name.
      - name: Upgrade 0.2.0-rc.1 in place (pinned), and restore its safety copy on an empty database
        if: ${{ !cancelled() }}
        env:
          PREVIOUS_TAG: v0.2.0-rc.1
        run: ./scripts/upgrade-test.sh upgrade "${{ github.sha }}"
      # 0.2.1 (schema 16) is the last release before migration 0017 (names). Once 0.3.0 is published the first step above starts from
      # 0.3.0, so this pin keeps the 0.2.1 to 0.3 jump, with its account settings move, tested.
      - name: Upgrade 0.2.1 in place (pinned), and restore its safety copy on an empty database
        if: ${{ !cancelled() }}
        env:
          PREVIOUS_TAG: v0.2.1
        run: ./scripts/upgrade-test.sh upgrade "${{ github.sha }}"

  # Not a required check (yet). A real browser against the real web, api and Postgres containers.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (pinned in package.json)
        run: npm install --global corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The same images the two image jobs build (same arguments, so the layers come from their cache).
      # They are only read from the cache here, never written, so this job cannot disturb the others.
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: ghcr.io/officialjcreyes/kinship-api:e2e
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: ghcr.io/officialjcreyes/kinship-web:e2e
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
      - name: Cache the Playwright browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        run: pnpm --filter @kinship/e2e exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries (browser already cached)
        if: ${{ steps.browsers.outputs.cache-hit == 'true' }}
        run: pnpm --filter @kinship/e2e exec playwright install-deps chromium
      - name: Run the end-to-end tests
        run: pnpm --filter @kinship/e2e e2e
      - name: Keep traces, screenshots and logs (only when something failed)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7
