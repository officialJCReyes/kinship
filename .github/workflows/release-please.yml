# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Keeps one open pull request, "chore: release x.y.z", that holds the next version number (from the Conventional Commits since
# the last release), the new CHANGELOG.md section and the bumped versions (see release-please-config.json). Merging it is the
# only manual step before tagging. This workflow never creates a tag or a GitHub Release (skip-github-release): the maintainer
# tags the merge commit, which starts release.yml. See docs/decisions/0017-release-please.md.
#
# Switched on after 0.2.0 was published (ADR 0017): it runs on every push to main and keeps that pull request up to date. If no
# commit since the last release is user-facing (feat, fix, perf, revert, security or a breaking change) it opens nothing. It needs
# Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"; with that off the run fails with a
# message and nothing else happens. It can also be started by hand.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default; the job asks for what it needs.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Update the release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release branch and its commit
      pull-requests: write # open and update the pull request
      issues: write # release-please labels the pull request
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
