# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publishes the project website (the static files in site/) to GitHub Pages at https://kinshiptree.app/. Pages must be switched on
# once by hand: Settings > Pages > Build and deployment > Source: GitHub Actions.
#
# The Docs section is not hand-written: it is a Starlight site (apps/docs) built from INSTALL.md, UPGRADE.md and
# docs/backup-format.md on every deploy and published under /docs/, so it always matches the repository (ADR 0023, ADR 0030).
# That is why this workflow also runs when those files change. It needs Node and pnpm, like CI.
#
# The current version on the pages is written as @@VERSION@@ in site/ and is filled in here from the latest published GitHub Release,
# so it never goes ahead of what can be pulled. The site is rebuilt when site/ changes on main, and again whenever the Release workflow
# finishes on a tag push (the Release is created only after the images are pushed and smoke-tested). It can also be started by hand.
# Wording that depends on a release (the roadmap, "Soon" chips) is edited by hand in the release pull request; see ADR 0022.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'INSTALL.md'
      - 'UPGRADE.md'
      - 'docs/backup-format.md'
      - 'apps/docs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

# No permissions by default; the jobs ask for what they need.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's Pages starter workflows: build and upload, then deploy. With upload-pages-artifact and deploy-pages in
# ONE job, deploy-pages sometimes lists the run's artifacts a fraction of a second after the upload and finds none ("Found 0
# artifact(s)"; actions/deploy-pages#451). That failed the first deploy after a Release run (run 45109796125, #229). Across a job
# boundary the artifact is listed long after it was finalized, and re-running only the failed deploy job reuses the same artifact
# (re-running a one-job layout uploads a second "github-pages" artifact and then fails on that).
jobs:
  build:
    name: Build the website
    # A workflow_run only counts when the Release workflow succeeded on a pushed tag (not a dry run, not a pull request).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository and read the latest release
    steps:
      # Always the site on main, even when started by a Release run on a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Node 26 does not bundle corepack. Same pinned version as CI and the Dockerfiles.
      - name: Enable pnpm (pinned in package.json)
        run: npm install --global corepack@0.34.6 && corepack enable
      - name: Build the Docs (Starlight), from the repository's Markdown
        run: |
          pnpm install --frozen-lockfile --filter @kinship/docs...
          pnpm --filter @kinship/docs build
      - name: Fill in the current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "latest" is the newest published stable release; release candidates are pre-releases and never count.
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest release tag '${tag}' is not a stable version number"
            exit 1
          fi
          echo "Publishing the site for version ${version}"
          rm -rf _site
          cp -R site _site
          rm -f _site/README.md # notes for contributors, not part of the website
          cp -R apps/docs/dist _site/docs # the Docs, built above; the site keeps its own 404 page at the root
          rm -f _site/docs/404.html
          find _site -name '*.html' -exec sed -i "s/@@VERSION@@/${version}/g" {} +
          if grep -rq --include='*.html' '@@VERSION@@' _site; then
            echo "::error::A version placeholder was left in the site"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish the website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove to Pages that this run is the publisher
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
