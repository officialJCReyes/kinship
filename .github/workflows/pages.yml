#
# Publishes the project website (the static files in site/) to GitHub Pages at
# https://officialjcreyes.github.io/kinship/. There is no build step and no custom domain. Pages must be switched on once by hand:
# Settings > Pages > Build and deployment > Source: GitHub Actions. The site uses only relative links, so it works under /kinship/.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# No permissions by default; the jobs ask for what they need.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
      pages: write # publish to GitHub Pages
      id-token: write # prove to Pages that this run is the publisher
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
