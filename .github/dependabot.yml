version: 2
updates:
  # JavaScript dependencies (pnpm workspace: root, apps/*, packages/*).
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/apps/*'
      - '/packages/*'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']

  # Base images in the api and web Dockerfiles.
  - package-ecosystem: 'docker'
    directories:
      - '/apps/api'
      - '/apps/web'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'

  # Actions used by the workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns: ['*']

  # Images in compose.dev.yml (compose.yml is added when it exists).
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
