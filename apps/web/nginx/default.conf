#
# KinShip web container: serves the built UI on :8080 (plain HTTP; your reverse
# proxy terminates TLS) and proxies /api to the api container.

# Scheme the visitor used: trust the reverse proxy's header, else our own.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers. Keep them here at server level only: an add_header inside
  # a location block would silently drop these. HSTS belongs to the reverse
  # proxy that terminates TLS, not here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Container health: nginx is up. (The api has its own health check.)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The api. The address is looked up on each request through Docker's DNS, so
  # nginx starts even if the api is not up yet and follows it when it restarts.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # $http_host keeps the port (the api compares it with the browser's Origin for CSRF protection).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Some reverse proxies change Host and send the public name here instead. An empty value is not sent.
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    # The version of this web container (written in at image build). The api refuses to work next to a different one.
    proxy_set_header X-KinShip-Web-Version "__KINSHIP_WEB_VERSION__";
    # Fail fast when the api is down, so the UI can say so instead of spinning.
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
  }

  # A backup download is streamed straight through: no buffering of a large archive in nginx's temp files (the container has
  # a read-only disk and a small /tmp), and time for a slow connection.
  location = /api/admin/backups/download {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    # The version of this web container (written in at image build). The api refuses to work next to a different one.
    proxy_set_header X-KinShip-Web-Version "__KINSHIP_WEB_VERSION__";
    proxy_connect_timeout 3s;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Built files have content hashes in their names, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The theme script is not hashed (index.html names it plainly), so it must be revalidated on every load: a new
  # release reaches users at once. A missing file is a 404, never the app shell served as JavaScript.
  location = /theme-init.js {
    expires -1;
    try_files $uri =404;
  }

  # Everything else is the single-page app; the browser router handles the path.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
