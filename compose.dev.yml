#
# For contributors: builds from source; the API restarts and the UI reloads when you
# save a file.
#   docker compose -f compose.dev.yml up --build     # then open http://localhost:5173
# The passwords below are for this local, throwaway setup only. The database is
# published on 127.0.0.1:5433 so the API tests (pnpm test) can reach it.
name: kinship-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: kinship
      POSTGRES_PASSWORD: dev-owner-password
      POSTGRES_DB: kinship
    ports:
      - '127.0.0.1:5433:5432'
    # Postgres 18 images keep data in a version folder under /var/lib/postgresql.
    volumes:
      - kinship-dev-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kinship -d kinship']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      LOG_LEVEL: debug
      DB_HOST: db
      DB_NAME: kinship
      DB_OWNER_USER: kinship
      DB_OWNER_PASSWORD: dev-owner-password
      DB_APP_USER: kinship_app
      DB_APP_PASSWORD: dev-app-password
      # A throwaway key for this local setup only.
      FILE_ENCRYPTION_KEY: ZGV2LWtleS1mb3ItbG9jYWwtdGVzdGluZy1vbmx5ISE=
      FILES_DIR: /tmp/kinship-files
      GIT_COMMIT: dev
      # Where the first-run setup message tells you to go (the Vite dev server).
      PUBLIC_URL: http://localhost:5173
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/migrations:/app/apps/api/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Vite dev server: hot reload for the UI. It proxies /api to the api service.
  # (The production web image is nginx; see apps/web/Dockerfile.)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kinship-dev-db: {}
